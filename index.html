<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12100d" />
    <meta name="description" content="Plante e proteja a floresta do Arthur." />
    <title>Arthur's Redemption</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --ui: #f3e7cf;
        --ui-dim: rgba(243, 231, 207, 0.62);
        --panel: rgba(0, 0, 0, 0.5);
        --panel-solid: rgba(24, 20, 15, 0.92);
        --accent: #8fd06a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #12100d;
        color: var(--ui);
        font: 500 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
        overscroll-behavior: none;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      body[data-tool='pan'] #game {
        cursor: grab;
      }

      /* ---- HUD ---- */
      #hud {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        right: calc(10px + env(safe-area-inset-right));
        display: grid;
        gap: 6px;
        padding: 8px 10px;
        border-radius: 12px;
        background: var(--panel);
        backdrop-filter: blur(6px);
        pointer-events: none;
      }
      .gauge {
        display: grid;
        grid-template-columns: 18px 116px 38px;
        align-items: center;
        gap: 7px;
        font-variant-numeric: tabular-nums;
      }
      .gauge .icon {
        font-size: 14px;
        line-height: 1;
        text-align: center;
      }
      .gauge .track {
        position: relative;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.13);
        overflow: hidden;
      }
      .gauge .fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        border-radius: 999px;
        transition: width 120ms linear;
      }
      #bar-trees {
        background: linear-gradient(90deg, #4b8f43, var(--accent));
      }
      #bar-water {
        background: linear-gradient(90deg, #2f7a94, #56b4d3);
      }
      #bar-water.empty {
        background: #7a3b32;
      }
      .gauge .goal {
        position: absolute;
        top: -2px;
        bottom: -2px;
        left: 90%;
        width: 2px;
        background: rgba(255, 255, 255, 0.55);
      }
      .gauge .val {
        text-align: right;
        font-size: 11px;
        color: var(--ui-dim);
      }

      /* ---- palheta ---- */
      #palette {
        position: fixed;
        left: 50%;
        bottom: calc(14px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        padding: 6px;
        border-radius: 16px;
        background: var(--panel-solid);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
      }
      #palette button {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--ui);
        font-size: 20px;
        cursor: pointer;
        transition:
          background 120ms ease,
          transform 120ms ease;
      }
      #palette button:hover {
        background: rgba(255, 255, 255, 0.13);
      }
      #palette button.active {
        background: rgba(143, 208, 106, 0.24);
        box-shadow: inset 0 0 0 2px rgba(143, 208, 106, 0.7);
      }
      #palette button:active {
        transform: scale(0.95);
      }
      #brush-btn {
        font-size: 13px !important;
        font-variant-numeric: tabular-nums;
        color: var(--ui-dim) !important;
        border-left: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 0 12px 12px 0 !important;
        width: 44px !important;
      }

      /* ---- perf / debug / hint ---- */
      #fire-pill {
        position: fixed;
        top: 48px;
        right: 12px;
        display: none;
        align-items: center;
        gap: 5px;
        padding: 4px 9px;
        border-radius: 999px;
        background: rgba(120, 26, 8, 0.86);
        color: #ffd8a8;
        font: 700 12px/1 ui-monospace, monospace;
        pointer-events: none;
        animation: firePulse 1s ease-in-out infinite;
      }
      #fire-pill.on {
        display: flex;
      }
      @keyframes firePulse {
        0%, 100% { box-shadow: 0 0 0 rgba(255, 120, 40, 0); }
        50% { box-shadow: 0 0 12px rgba(255, 120, 40, 0.55); }
      }
      #perf {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 5px 8px;
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.5);
        color: #bfe9a8;
        font: 600 11px/1.2 ui-monospace, monospace;
        letter-spacing: 0.02em;
        pointer-events: none;
        opacity: 0.85;
      }
      #perf b {
        color: #f0f6e8;
        font-weight: 700;
      }
      #debug {
        display: none;
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.62);
        color: #bfe9a8;
        font: 500 11px/1.5 ui-monospace, monospace;
        white-space: pre;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: calc(84px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        padding: 7px 14px;
        border-radius: 999px;
        background: var(--panel);
        color: var(--ui-dim);
        font-size: 12px;
        pointer-events: none;
        animation: hint-fade 9s ease forwards;
      }
      @keyframes hint-fade {
        0%,
        72% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #hint {
          animation: none;
        }
        .gauge .fill {
          transition: none;
        }
      }
    </style>
  </head>
  <body data-tool="tree">
    <canvas id="game"></canvas>
    <div id="fire-pill"><span>🔥</span><span id="fire-count">0</span></div>

    <div id="perf" title="fps · % de frames redesenhados · tecla ` alterna"></div>
    <div id="debug"></div>

    <div id="hud" aria-hidden="true">
      <div class="gauge">
        <span class="icon">🌲</span>
        <div class="track"><div class="fill" id="bar-trees"></div><i class="goal"></i></div>
        <span class="val" id="val-trees">0%</span>
      </div>
      <div class="gauge">
        <span class="icon">💧</span>
        <div class="track"><div class="fill" id="bar-water"></div></div>
        <span class="val" id="val-water">100%</span>
      </div>
    </div>

    <div id="palette" role="toolbar" aria-label="Ferramentas">
      <button data-tool="pan" title="Mover a vista (3)" aria-label="Mover a vista">🖐️</button>
      <button data-tool="tree" class="active" title="Plantar floresta (1)" aria-label="Plantar floresta">🌲</button>
      <button data-tool="water" title="Pintar água (2)" aria-label="Pintar água">💧</button>
      <button id="brush-btn" title="Tamanho do pincel ( [ e ] )" aria-label="Tamanho do pincel">
        <span id="brush-val">2</span>
      </button>
    </div>

    <div id="hint">arraste para plantar · dois dedos ou botão direito movem</div>
    <noscript>Este jogo precisa de JavaScript habilitado.</noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
