<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12100d" />
    <meta name="description" content="Plante e proteja a floresta do Arthur." />
    <title>Arthur's Redemption</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --ui: #f3e7cf;
        --ui-dim: rgba(243, 231, 207, 0.62);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #12100d;
        color: var(--ui);
        font: 500 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
        overscroll-behavior: none;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      #debug {
        display: none;
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.62);
        color: #bfe9a8;
        font: 500 11px/1.5 ui-monospace, monospace;
        white-space: pre;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.5);
        color: var(--ui-dim);
        font-size: 12px;
        letter-spacing: 0.01em;
        pointer-events: none;
        animation: hint-fade 8s ease forwards;
      }
      @keyframes hint-fade {
        0%,
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #hint {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="debug"></div>
    <div id="hint">arraste para mover · scroll ou pinça para zoom</div>
    <noscript>Este jogo precisa de JavaScript habilitado.</noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
